name: business-briefing-deck
version: 0.1.0
namespace: katib
description: |
  Business briefing deck — generic 8-slide A4 landscape template for
  presenting a measured trial result to senior decision-makers. Cover,
  hero stat, methodology flow, objection-killer quote, KPI grid, real
  trial photo, commercial impact, next-step CTA. Companion to the
  report-trial-case-study recipe (the leave-behind PDF) — same brand,
  same numbers, but reframed for projection in front of a customer
  (one idea per slide).
languages: [en]
target_pages: [8, 8]
page_limit: 8
when: Live customer pitch following a trial or pilot. Project full-screen on a meeting display, or send as a self-paced PDF preview before a sales call. Use the report-trial-case-study recipe for the leave-behind document; this is the talk track.
keywords: [pitch-deck, presentation, slides, executive, trial, briefing, customer-pitch, sales-deck]

sections:

  # 1. Cover slide — text-only by default for a portable, asset-free template.
  #    To upgrade to a full-bleed photo cover, change `variant` to
  #    `image-background` and add an `image:` block with `source: user-file`
  #    (path to a brand asset) or `source: url`. The image-background variant
  #    accepts user-file / url sources only — the recipe stays generic.
  - component: slide-frame
    variant: title-only
    inputs:
      eyebrow: "EXECUTIVE BRIEFING · [MONTH YEAR]"
      title: "[HEADLINE METRIC]"
      subtitle: "[CUSTOMER] trial · [ASSET] · [REGION] · Verified by [PRIMARY INSTRUMENT] and [SECONDARY INSTRUMENT]."

  # 2. The result — single huge stat
  - component: slide-stat
    inputs:
      eyebrow: "VERIFIED RESULT · 02"
      value: "[XX%]"
      label: "[primary outcome — e.g. net diesel reduction, real-world operations]"
      body: "Lorem ipsum dolor sit amet, consectetur adipiscing elit. Cross-verified by two independent instruments — [PRIMARY INSTRUMENT] ([XX.XX%]) and [SECONDARY INSTRUMENT] ([+XX.X%] efficiency). Same asset. Same operator. [N] trial days."
      delta: "[+XX.X%] [SECONDARY INSTRUMENT]"
      delta_tone: "success"

  # 3. Methodology — 4-step process flow showing how the number was measured
  - component: slide-frame
    variant: content
    inputs:
      eyebrow: "METHODOLOGY · 03"
      title: "How we measured it"
      subtitle: "Same asset, same operator, same calculation — only [VARIABLE] changed."
      raw_body: |
        <div style="display: flex; flex-direction: row; align-items: stretch; gap: 12pt; margin-top: 18pt;">
          <div style="flex: 1; padding: 16pt; border: 1pt solid var(--border); border-left: 3pt solid var(--accent); background: var(--page-bg);">
            <div style="font-size: 22pt; font-weight: 700; color: var(--accent); line-height: 1; margin-bottom: 6pt;">1</div>
            <div style="font-size: 11pt; font-weight: 700; color: var(--text); margin-bottom: 4pt;">Baseline</div>
            <div style="font-size: 9.5pt; color: var(--text-secondary); line-height: 1.4;">[DATE]. [VARIABLE] off. Live commercial run, [REGION].</div>
          </div>
          <div style="flex: 1; padding: 16pt; border: 1pt solid var(--border); border-left: 3pt solid var(--accent); background: var(--page-bg);">
            <div style="font-size: 22pt; font-weight: 700; color: var(--accent); line-height: 1; margin-bottom: 6pt;">2</div>
            <div style="font-size: 11pt; font-weight: 700; color: var(--text); margin-bottom: 4pt;">[INSTRUMENT]</div>
            <div style="font-size: 9.5pt; color: var(--text-secondary); line-height: 1.4;">Lorem ipsum dolor sit amet — primary measurement, secondary correction.</div>
          </div>
          <div style="flex: 1; padding: 16pt; border: 1pt solid var(--border); border-left: 3pt solid var(--accent); background: var(--page-bg);">
            <div style="font-size: 22pt; font-weight: 700; color: var(--accent); line-height: 1; margin-bottom: 6pt;">3</div>
            <div style="font-size: 11pt; font-weight: 700; color: var(--text); margin-bottom: 4pt;">Net = [A] − [B]</div>
            <div style="font-size: 9.5pt; color: var(--text-secondary); line-height: 1.4;">True net consumption. Identical math on both test days.</div>
          </div>
          <div style="flex: 1; padding: 16pt; border: 1pt solid var(--accent); border-left: 3pt solid var(--accent); background: rgba(34, 197, 94, 0.08);">
            <div style="font-size: 22pt; font-weight: 700; color: var(--accent); line-height: 1; margin-bottom: 6pt;">4</div>
            <div style="font-size: 11pt; font-weight: 700; color: var(--text); margin-bottom: 4pt;">[VARIABLE] day</div>
            <div style="font-size: 9.5pt; color: var(--text-secondary); line-height: 1.4;">[DATE]. Same calculation. [BASELINE] → [TRIAL] = <strong style="color: #16a34a;">[−XX%]</strong>.</div>
          </div>
        </div>
        <div style="margin-top: 22pt; padding-top: 12pt; border-top: 0.5pt solid var(--border); font-size: 9pt; color: var(--text-tertiary); letter-spacing: 0.04em;">CONTROL VARIABLES NOTED · CONTINUOUS SIGNAL · NO ADJUSTMENT FACTORS</div>

  # 4. The cherry-pick killer — the objection a sceptical buyer raises,
  #    pre-empted with the data point that defeats it.
  - component: slide-quote
    inputs:
      eyebrow: "THE OBJECTION-KILLER · 04"
      quote: "Lorem ipsum dolor sit amet — the asset operated under a [HARDER CONDITION] on the [VARIABLE] day, yet still delivered [+XX.X%] efficiency. [HARDER CONDITION] cannot explain it. [VARIABLE] is the only variable."
      author: "[INDEPENDENT INSTRUMENT REPORT]"
      role: "[Independent telemetry / certification body] · [ASSET ID]"
      source: "[BASELINE FIGURE] → [TRIAL FIGURE] · [+X.X%] [HARDER CONDITION]"

  # 5. Outcomes — four big numbers as a grid (emissions, cost categories,
  #    KPI bands — whatever the four most important deltas are).
  - component: slide-frame
    variant: content
    inputs:
      eyebrow: "OUTCOMES · 05"
      title: "Improved across the board"
      subtitle: "Real per-day data from a working operation — not lab estimates."
      raw_body: |
        <div style="display: flex; flex-direction: row; gap: 14pt; margin-top: 22pt;">
          <div style="flex: 1; padding: 18pt 14pt; border: 1pt solid var(--border); border-top: 4pt solid #2dd4bf; text-align: center;">
            <div style="font-size: 36pt; font-weight: 800; color: #14b8a6; line-height: 1;">[−XX%]</div>
            <div style="font-size: 11pt; font-weight: 700; color: var(--text); margin-top: 8pt;">[KPI 1]</div>
            <div style="font-size: 9pt; color: var(--text-tertiary); margin-top: 4pt;">[from] → [to] [unit]</div>
          </div>
          <div style="flex: 1; padding: 18pt 14pt; border: 1pt solid var(--border); border-top: 4pt solid #60a5fa; text-align: center;">
            <div style="font-size: 36pt; font-weight: 800; color: #3b82f6; line-height: 1;">[−XX%]</div>
            <div style="font-size: 11pt; font-weight: 700; color: var(--text); margin-top: 8pt;">[KPI 2]</div>
            <div style="font-size: 9pt; color: var(--text-tertiary); margin-top: 4pt;">[from] → [to] [unit]</div>
          </div>
          <div style="flex: 1; padding: 18pt 14pt; border: 1pt solid var(--border); border-top: 4pt solid #22c55e; text-align: center;">
            <div style="font-size: 36pt; font-weight: 800; color: #16a34a; line-height: 1;">[−XX%]</div>
            <div style="font-size: 11pt; font-weight: 700; color: var(--text); margin-top: 8pt;">[KPI 3]</div>
            <div style="font-size: 9pt; color: var(--text-tertiary); margin-top: 4pt;">[from] → [to] [unit]</div>
          </div>
          <div style="flex: 1; padding: 18pt 14pt; border: 1pt solid var(--border); border-top: 4pt solid #f59e0b; text-align: center;">
            <div style="font-size: 36pt; font-weight: 800; color: #d97706; line-height: 1;">[−XX%]</div>
            <div style="font-size: 11pt; font-weight: 700; color: var(--text); margin-top: 8pt;">[KPI 4]</div>
            <div style="font-size: 9pt; color: var(--text-tertiary); margin-top: 4pt;">[from] → [to] [unit]</div>
          </div>
        </div>
        <div style="margin-top: 24pt; padding: 14pt 16pt; background: rgba(34, 197, 94, 0.08); border-left: 3pt solid var(--accent); font-size: 10.5pt; color: var(--text); line-height: 1.5;">
          Lorem ipsum dolor sit amet — every regulated indicator reduced by <strong>[XX–XX%]</strong>. Direct support for [STRATEGIC THEME — e.g. Net Zero, OPEX reduction, compliance].
        </div>

  # 6. The real trial — operator photo + key facts. Single-column raw_body
  #    inside slide-frame content variant so we control image height and the
  #    whole composition fits the 174mm slide page reliably.
  #    Drop a real photo in at ~/.katib/brands/<your-brand>-assets/photos/
  #    or replace `image.source` with `gemini` for a placeholder.
  - component: slide-frame
    variant: content
    inputs:
      eyebrow: "THE TRIAL · 06"
      title: "[CUSTOMER] · [ASSET ID]"
      subtitle: "A real working operator on real routes — not a lab."
      raw_body: |
        <div style="display: flex; flex-direction: row; gap: 18pt; align-items: stretch; margin-top: 14pt;">
          <div style="flex: 0 0 38%; height: 95mm; border: 1.5pt dashed var(--border); border-radius: 4pt; display: flex; align-items: center; justify-content: center; background: var(--code-bg); padding: 16pt; text-align: center;">
            <div style="font-size: 9pt; letter-spacing: 0.10em; text-transform: uppercase; color: var(--text-tertiary); line-height: 1.5;">PLACE TRIAL PHOTO HERE<br><span style="font-size: 8pt; letter-spacing: 0.04em; text-transform: none;">Replace this block with an &lt;img&gt; tag pointing at your photo, or use the two-column-image-text component instead.</span></div>
          </div>
          <div style="flex: 1; padding-left: 6pt; border-left: 2pt solid var(--accent);">
            <ul style="list-style: none; padding: 0; margin: 0; font-size: 11pt; line-height: 1.65;">
              <li style="padding: 6pt 0; border-bottom: 0.5pt solid var(--border);"><strong style="color: var(--accent);">Asset</strong> · [Asset model and specification]</li>
              <li style="padding: 6pt 0; border-bottom: 0.5pt solid var(--border);"><strong style="color: var(--accent);">Operator</strong> · [Customer name, region]</li>
              <li style="padding: 6pt 0; border-bottom: 0.5pt solid var(--border);"><strong style="color: var(--accent);">Workload</strong> · [Distance / hours / units across [N] live commercial runs]</li>
              <li style="padding: 6pt 0; border-bottom: 0.5pt solid var(--border);"><strong style="color: var(--accent);">Install</strong> · [Time to fit, calibrate and bring operational]</li>
              <li style="padding: 6pt 0;"><strong style="color: var(--accent);">Uptime</strong> · [%] across [duration] · [N] device failures</li>
            </ul>
            <div style="margin-top: 10pt; padding-top: 8pt; border-top: 0.5pt solid var(--border); font-size: 8.5pt; color: var(--text-tertiary); letter-spacing: 0.05em;">SAME ASSET · SAME OPERATOR · NO INFRASTRUCTURE MODIFICATION</div>
          </div>
        </div>

  # 7. The dollars — what the headline % means commercially
  - component: slide-frame
    variant: content
    inputs:
      eyebrow: "WHAT IT'S WORTH · 07"
      title: "Per asset, at [CURRENCY][UNIT PRICE]"
      subtitle: "[X.X UNITS] saved every operating hour. [XX%] applies to whatever you spend on [INPUT]."
      raw_body: |
        <div style="display: flex; flex-direction: row; gap: 14pt; margin-top: 22pt;">
          <div style="flex: 1; padding: 18pt 14pt; border: 1pt solid var(--border); text-align: center;">
            <div style="font-size: 9pt; letter-spacing: 0.10em; text-transform: uppercase; color: var(--text-tertiary); font-weight: 700;">Per hour</div>
            <div style="font-size: 30pt; font-weight: 800; color: var(--accent); line-height: 1; margin-top: 8pt;">[CCY][XX]</div>
            <div style="font-size: 9pt; color: var(--text-tertiary); margin-top: 6pt;">[X.X units × CCY price]</div>
          </div>
          <div style="flex: 1; padding: 18pt 14pt; border: 1pt solid var(--border); text-align: center;">
            <div style="font-size: 9pt; letter-spacing: 0.10em; text-transform: uppercase; color: var(--text-tertiary); font-weight: 700;">Per shift</div>
            <div style="font-size: 30pt; font-weight: 800; color: var(--accent); line-height: 1; margin-top: 8pt;">[CCY][XXX]</div>
            <div style="font-size: 9pt; color: var(--text-tertiary); margin-top: 6pt;">[N-hour shift]</div>
          </div>
          <div style="flex: 1; padding: 18pt 14pt; border: 1pt solid var(--border); text-align: center;">
            <div style="font-size: 9pt; letter-spacing: 0.10em; text-transform: uppercase; color: var(--text-tertiary); font-weight: 700;">Per month</div>
            <div style="font-size: 30pt; font-weight: 800; color: var(--accent); line-height: 1; margin-top: 8pt;">[CCY][XX.XK]</div>
            <div style="font-size: 9pt; color: var(--text-tertiary); margin-top: 6pt;">[N working days]</div>
          </div>
          <div style="flex: 1; padding: 18pt 14pt; border: 2pt solid #16a34a; background: rgba(34, 197, 94, 0.06); text-align: center;">
            <div style="font-size: 9pt; letter-spacing: 0.10em; text-transform: uppercase; color: #16a34a; font-weight: 800;">Per year</div>
            <div style="font-size: 30pt; font-weight: 800; color: #16a34a; line-height: 1; margin-top: 8pt;">[CCY][XXX,XXX]</div>
            <div style="font-size: 9pt; color: var(--text-tertiary); margin-top: 6pt;">[N days · X,XXX units]</div>
          </div>
        </div>
        <div style="margin-top: 22pt; padding: 14pt 16pt; background: var(--page-bg); border: 1pt solid var(--border);">
          <div style="font-size: 9pt; letter-spacing: 0.10em; text-transform: uppercase; color: var(--text-tertiary); font-weight: 700; margin-bottom: 8pt;">5-Year cumulative · whole fleet</div>
          <div style="display: flex; flex-direction: row; gap: 16pt; font-size: 11pt; color: var(--text);">
            <div><strong style="color: var(--accent);">[N] assets</strong> · [CCY][X.XX]M</div>
            <div><strong style="color: var(--accent);">[N] assets</strong> · [CCY][XX.XX]M</div>
            <div><strong style="color: var(--accent);">[N] assets</strong> · [CCY][XX.XX]M</div>
            <div><strong style="color: var(--accent);">[N] assets</strong> · [CCY][XX.XX]M</div>
          </div>
        </div>

  # 8. Next step — three pilot options + primary contact strip
  - component: slide-frame
    variant: content
    inputs:
      eyebrow: "NEXT STEP · 08"
      title: "Prove it on your operation."
      subtitle: "Three ways to validate [PRODUCT] in your operating environment."
      raw_body: |
        <div style="display: flex; flex-direction: row; gap: 14pt; margin-top: 22pt;">
          <div style="flex: 1; padding: 18pt 16pt; border: 1pt solid var(--border); border-top: 4pt solid var(--accent);">
            <div style="font-size: 9pt; letter-spacing: 0.10em; text-transform: uppercase; color: var(--accent); font-weight: 800; margin-bottom: 8pt;">Pilot programme</div>
            <div style="font-size: 11pt; color: var(--text); line-height: 1.5;">Lorem ipsum — deploy on one asset for [N] working days. Measure savings on your routes, with your operators.</div>
          </div>
          <div style="flex: 1; padding: 18pt 16pt; border: 1pt solid var(--border); border-top: 4pt solid var(--accent);">
            <div style="font-size: 9pt; letter-spacing: 0.10em; text-transform: uppercase; color: var(--accent); font-weight: 800; margin-bottom: 8pt;">[OFFER] ROI assessment</div>
            <div style="font-size: 11pt; color: var(--text); line-height: 1.5;">Lorem ipsum dolor sit amet — tailored savings model based on your usage profile, fleet size, and current input pricing.</div>
          </div>
          <div style="flex: 1; padding: 18pt 16pt; border: 1pt solid var(--border); border-top: 4pt solid var(--accent);">
            <div style="font-size: 9pt; letter-spacing: 0.10em; text-transform: uppercase; color: var(--accent); font-weight: 800; margin-bottom: 8pt;">Back-to-back test</div>
            <div style="font-size: 11pt; color: var(--text); line-height: 1.5;">Lorem ipsum — same asset, same route — device on, device off. One defensible number for procurement.</div>
          </div>
        </div>
        <div style="margin-top: 26pt; padding: 18pt 22pt; background: var(--accent); color: #ffffff; display: flex; flex-direction: row; justify-content: space-between; align-items: center;">
          <div>
            <div style="font-size: 9pt; letter-spacing: 0.10em; text-transform: uppercase; opacity: 0.78; font-weight: 700; color: #ffffff;">[REGION] · primary contact</div>
            <div style="font-size: 16pt; font-weight: 700; margin-top: 4pt; color: #ffffff;">[Contact Name] &middot; [Company]</div>
            <div style="font-size: 11pt; opacity: 0.92; margin-top: 4pt; color: #ffffff;">[email@domain] &middot; [+phone]</div>
          </div>
          <div style="text-align: right; font-size: 11pt; color: #ffffff; opacity: 0.92;">[domain]</div>
        </div>
